name: Live Tests

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RUN to use the dedicated test account'
        required: true
        type: string

permissions:
  contents: read

jobs:
  live:
    if: inputs.confirm == 'RUN'
    runs-on: ubicloud-standard-2
    timeout-minutes: 10
    # Configure this environment with required reviewers and the two secrets.
    environment: live-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Run read-only live tests
        env:
          MYMACROS_LIVE_TESTS: '1'
          MYMACROS_TEST_USER: ${{ secrets.MYMACROS_TEST_USER }}
          MYMACROS_TEST_PASSWORD: ${{ secrets.MYMACROS_TEST_PASSWORD }}
        run: npm run test:live
